<!DOCTYPE html>
<html lang="id">
<head>
    <script src="script.js"></script>
</body>
</html>
    <style>
        *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
position:fixed;
width:100%;
z-index:999;
}

nav h1{
font-family:'Orbitron';
color:#fff;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:120px 8%;
background:
radial-gradient(circle at top right,#173cff,#050816);
}

.hero-text{
max-width:550px;
}

.hero-text h2{
font-size:70px;
line-height:1;
font-family:'Orbitron';
margin-bottom:20px;
}

.hero-text p{
margin-bottom:30px;
opacity:.8;
}

.hero-text a{
background:white;
color:#050816;
padding:15px 35px;
border-radius:50px;
text-decoration:none;
font-weight:600;
}

.hero-img img{
width:500px;
border-radius:30px;
box-shadow:0 0 40px #173cff;
}

.produk{
padding:100px 8%;
}

.produk h2{
text-align:center;
margin-bottom:50px;
font-size:40px;
}

.card-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px #173cff;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
}

.card h3{
margin-top:15px;
}

.form-section{
padding:100px 8%;
}

.form-section h2{
text-align:center;
margin-bottom:40px;
}

form{
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
gap:20px;
}

input{
padding:15px;
border:none;
border-radius:12px;
background:#10182f;
color:white;
}

button{
padding:15px;
background:#173cff;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#2952ff;
}

@media(max-width:768px){

.hero{
flex-direction:column;
text-align:center;
gap:50px;
}

.hero-text h2{
font-size:45px;
}

.hero-img img{
width:100%;
}

}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanStep Store</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <h1>URBANSTEP</h1>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#produk">Produk</a></li>
        <li><a href="#pesan">Pesan</a></li>
    </ul>
</nav>

<section id="home" class="hero">

    <div class="hero-text">
        <h2>STEP INTO<br>THE FUTURE</h2>
        <p>Sepatu trend berkualitas premium dengan harga UMKM.</p>
        <a href="#produk">Lihat Koleksi</a>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700" alt="">
    </div>

</section>

<section id="produk" class="produk">

<h2>Koleksi Terbaru</h2>

<div class="card-container">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
<h3>Nike Air</h3>
<p>Rp 899.000</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500">
<h3>Urban Sneaker</h3>
<p>Rp 499.000</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1543508282-6319a3e2621f?w=500">
<h3>Street Y2K</h3>
<p>Rp 599.000</p>
</div>

</div>

</section>

<section id="pesan" class="form-section">

<h2>Form Pemesanan</h2>

<form id="orderForm">

<input type="text" name="nama" placeholder="Nama Lengkap" required>

<input type="text" name="produk" placeholder="Nama Produk" required>

<input type="number" name="jumlah" placeholder="Jumlah" required>

<input type="text" name="alamat" placeholder="Alamat" required>

<button type="submit">Pesan Sekarang</button>

</form>

</section>

<script src="script.js"></script>

</body>
</html>
